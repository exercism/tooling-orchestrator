name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      aws:
        # Pinned deliberately. LocalStack's 2026.x line (from 2026.3.0 onwards)
        # requires a LOCALSTACK_AUTH_TOKEN and exits 55 without one, so the
        # previously-unpinned :latest broke every build once it floated onto it.
        # 4.14.0 is the last release that boots unlicensed.
        image: "localstack/localstack:4.14.0"
        ports:
          - 4566

      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 2s
          --health-retries 10

    steps:
      ###
      # Checkout using GitHub's checkout action
      - uses: actions/checkout@v2

      ###
      # Setup Ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@a4effe49ee8ee5b8b5091268c473a4628afb5651
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      ###
      # Install bundler and yarn dependencies
      - name: Install dependencies
        env:
          EXERCISM_ENV: test
          EXERCISM_CI: true
          AWS_PORT: ${{ job.services.aws.ports['4566'] }}
        run: |
          bundle exec setup_exercism_config
          bundle exec setup_exercism_local_aws

      ###
      # Run the tests
      - name: Run Ruby tests
        env:
          EXERCISM_ENV: test
          EXERCISM_CI: true
          AWS_PORT: ${{ job.services.aws.ports['4566'] }}
          CAPTURE_CODE_COVERAGE: true
        run: |
          bundle exec rake test
