# What does this do?
# https://stackoverflow.com/a/56631458/856688
events {}

http {
  # The invokers poll GET /jobs/next every 0.6s and ~99% of those come back a
  # 404 meaning "no job available" — roughly 3,400 requests/minute of access
  # logs that tell us nothing, and about 7.6GB/mo of CloudWatch ingestion.
  #
  # Skip logging *only* that specific empty-queue response. A 404 on any other
  # route still gets logged, which matters: a route quietly not existing is a
  # real bug we'd otherwise never see.
  map "$status:$uri" $loggable {
    "404:/jobs/next" 0;
    default          1;
  }
  access_log /dev/stdout combined if=$loggable;

  # NGINX will handle gzip compression of responses from the app server
  gzip on;
  gzip_proxied any;
  gzip_types text/plain application/json;
  gzip_min_length 1000;

  server {
    listen 80;

    location / {
      # Reject requests with unsupported HTTP method
      if ($request_method !~ ^(GET|POST|HEAD|OPTIONS|PUT|DELETE|PATCH)$) {
        return 405;
      }

      # Only requests matching the whitelist expectations will
      # get sent to the application server
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
